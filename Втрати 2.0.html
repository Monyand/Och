<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedTactical - Система Обліку</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tactical: {
                            50: '#f4f6f0', 100: '#e5ebd9', 200: '#cbdab4', 300: '#a7c185',
                            400: '#84a65c', 500: '#648840', 600: '#4d6c2f', 700: '#3d5427',
                            800: '#324522', 900: '#2b3b1f', 950: '#151e0f',
                        },
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f140c; color: #e5ebd9; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #151e0f; }
        ::-webkit-scrollbar-thumb { background: #324522; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4d6c2f; }
        
        input[type="file"]::file-selector-button {
            border: none; background: #4d6c2f; color: #f4f6f0; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; margin-right: 10px; font-size: 12px;
            font-weight: bold; transition: background 0.2s;
        }
        input[type="file"]::file-selector-button:hover { background: #648840; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const DEFAULT_RANKS = ["Солдат", "Старший солдат", "Молодший сержант", "Сержант", "Старший сержант", "Головний сержант", "Молодший лейтенант", "Лейтенант", "Старший лейтенант", "Капітан", "Майор"];
        const DEFAULT_UNITS = ["1-ша рота", "2-га рота", "3-тя рота", "Взвод вогневої підтримки", "Розвідвзвод", "Управління батальйону"];
        const DEFAULT_SECTORS = ["Позиція 'Альфа'", "Позиція 'Браво'", "КСП батальйону", "Точка вивантаження", "Стабпункт"];
        const DEFAULT_CAUSES = [
            "Удар FPV", "Удар FPV (оптоволокно)", "Удар FPV (крило)", "Скид з БПЛА", 
            "Скид горючої суміші з дрона", "Скид з важкого бомбера", "Обстріл з міномета, 82мм", 
            "Обстріл з міномета, 120мм", "Обстріл з ствольної артилерії", "Підрив на ворожому мінуванні", 
            "Стрілецька зброя", "Залишив позицію", "Нещасний випадок / Хвороба", "Інше"
        ];

        const LOSS_TYPES = [
            "Поранення (300)", "Бойове травмування (300)", "Небойове травмування (300)", 
            "Загибель (200)", "Небойова смерть (200)", "Зниклий безвісти (ЗБВ)", "СЗЧ", "Дезертирство"
        ];
        
        const isAny300 = (type) => type && type.includes("(300)");
        const isAwol = (type) => type === "СЗЧ" || type === "Дезертирство";
        const isAny200 = (type) => type && type.includes("(200)");

        const BODY_REGIONS = [
            { id: 'head', name: 'Голова', x: 100, y: 35, r: 22 }, { id: 'neck', name: 'Шия', x: 100, y: 65, r: 10 },
            { id: 'chest', name: 'Грудна клітка', x: 100, y: 105, r: 25 }, { id: 'abdomen', name: 'Живіт/Пах', x: 100, y: 155, r: 20 },
            { id: 'arm_l', name: 'Ліва рука', x: 55, y: 120, r: 18 }, { id: 'arm_r', name: 'Права рука', x: 145, y: 120, r: 18 },
            { id: 'leg_l', name: 'Ліва нога', x: 80, y: 220, r: 25 }, { id: 'leg_r', name: 'Права нога', x: 120, y: 220, r: 25 }
        ];

        const CHART_COLORS = ['#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', '#22c55e', '#10b981', '#14b8a6', '#06b6d4', '#0ea5e9', '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e'];

        const Icon = ({ name, className }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    if (className) i.setAttribute('class', className);
                    spanRef.current.appendChild(i);
                    window.lucide.createIcons({ root: spanRef.current, nameAttr: 'data-lucide' });
                }
            }, [name, className]);
            return <span ref={spanRef} style={{ display: 'contents' }}></span>;
        };

        const ChartComponent = React.memo(({ type, data, options, className, title, showLabels, showPercentages }) => {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                
                if (window.ChartDataLabels) Chart.register(window.ChartDataLabels);

                Chart.defaults.color = '#6b7280';
                Chart.defaults.font.family = 'inherit';
                Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(21, 30, 15, 0.9)';
                Chart.defaults.plugins.tooltip.titleColor = '#fff';
                Chart.defaults.plugins.tooltip.borderColor = '#324522';
                Chart.defaults.plugins.tooltip.borderWidth = 1;

                const finalOptions = {
                    responsive: true, maintainAspectRatio: false, ...options,
                    plugins: {
                        ...options?.plugins,
                        datalabels: {
                            display: showLabels ? function(context) { return context.dataset.data[context.dataIndex] > 0; } : false,
                            color: '#fff',
                            font: { weight: 'bold', size: 10 },
                            textStrokeColor: '#151e0f',
                            textStrokeWidth: 3,
                            formatter: function(value, context) {
                                if (!showPercentages || (title && title.includes('час'))) return value; 

                                let sum = 0;
                                const chartType = context.chart.config.type;
                                const isStacked = options?.scales?.x?.stacked || options?.scales?.y?.stacked;

                                if (chartType === 'pie' || chartType === 'doughnut') {
                                    sum = context.chart.data.datasets[context.datasetIndex].data.reduce((a, b) => a + b, 0);
                                } else if (isStacked) {
                                    context.chart.data.datasets.forEach(ds => {
                                        sum += Number(ds.data[context.dataIndex]) || 0;
                                    });
                                } else {
                                    sum = context.chart.data.datasets[context.datasetIndex].data.reduce((a, b) => a + Number(b), 0);
                                }

                                if (sum === 0) return '0%';
                                let pct = (value / sum * 100);
                                return pct < 1 && pct > 0 ? '<1%' : Math.round(pct) + '%';
                            }
                        }
                    }
                };

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, { type, data, options: finalOptions });
                
                return () => { if (chartInstance.current) chartInstance.current.destroy(); }
            }, [data, options, type, showLabels, showPercentages]);

            const downloadImage = () => {
                if (chartRef.current) {
                    const canvas = chartRef.current;
                    const destCanvas = document.createElement('canvas');
                    destCanvas.width = canvas.width;
                    destCanvas.height = canvas.height;
                    const destCtx = destCanvas.getContext('2d');
                    
                    destCtx.fillStyle = '#151e0f'; 
                    destCtx.fillRect(0, 0, destCanvas.width, destCanvas.height);
                    destCtx.drawImage(canvas, 0, 0);
                    
                    const url = destCanvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = (title || 'analytics_chart') + '.png';
                    link.href = url;
                    link.click();
                }
            };

            const downloadExcel = async () => {
                if (!chartRef.current || !data || !window.ExcelJS) return;
                try {
                    const canvas = chartRef.current;
                    const destCanvas = document.createElement('canvas');
                    destCanvas.width = canvas.width;
                    destCanvas.height = canvas.height;
                    const destCtx = destCanvas.getContext('2d');
                    destCtx.fillStyle = '#151e0f'; 
                    destCtx.fillRect(0, 0, destCanvas.width, destCanvas.height);
                    destCtx.drawImage(canvas, 0, 0);
                    const base64Image = destCanvas.toDataURL('image/png');

                    const workbook = new ExcelJS.Workbook();
                    const cleanTitle = (title || 'Аналітика').replace(/[*?:/\\\[\]]/g, '').slice(0, 30);
                    const worksheet = workbook.addWorksheet(cleanTitle);

                    worksheet.mergeCells('A1', 'E1');
                    const titleCell = worksheet.getCell('A1');
                    titleCell.value = title || 'Аналітична діаграма';
                    titleCell.font = { name: 'Arial', size: 14, bold: true, color: { argb: 'FFFFFFFF' } };
                    titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2B3B1F' } };
                    titleCell.alignment = { vertical: 'middle', horizontal: 'center' };

                    const labels = data.labels || [];
                    const datasets = data.datasets || [];
                    
                    const headerRowValues = ['Показник / Категорія', ...datasets.map(ds => ds.label || 'Значення')];
                    if (datasets.length > 1) headerRowValues.push('Всього');
                    
                    worksheet.addRow([]);
                    const headerRow = worksheet.addRow(headerRowValues);
                    headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                    headerRow.eachCell(cell => {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF324522' } };
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    });

                    labels.forEach((label, idx) => {
                        const rowVals = [label];
                        let rowSum = 0;
                        datasets.forEach(ds => {
                            const val = Number(ds.data[idx]) || 0;
                            rowVals.push(val);
                            rowSum += val;
                        });
                        if (datasets.length > 1) rowVals.push(rowSum);
                        const r = worksheet.addRow(rowVals);
                        r.eachCell((cell, colNumber) => {
                            if (colNumber > 1) cell.alignment = { horizontal: 'right' };
                        });
                    });

                    const imageId = workbook.addImage({
                        base64: base64Image,
                        extension: 'png',
                    });

                    const startRow = labels.length + 5;
                    worksheet.addImage(imageId, {
                        tl: { col: 0, row: startRow },
                        ext: { width: 650, height: 360 }
                    });

                    worksheet.columns.forEach(column => {
                        let maxLength = 0;
                        column.eachCell({ includeEmpty: true }, (cell) => {
                            const columnLength = cell.value ? cell.value.toString().length : 10;
                            if (columnLength > maxLength) maxLength = columnLength;
                        });
                        column.width = Math.max(maxLength + 4, 16);
                    });

                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `${cleanTitle}.xlsx`;
                    link.click();
                } catch(err) {
                    console.error("Excel export error:", err);
                }
            };

            return (
                <div className={`relative group ${className}`}>
                    <canvas ref={chartRef}></canvas>
                    <div className="absolute top-1 right-1 flex gap-1 opacity-0 group-hover:opacity-100 transition z-10">
                        <button onClick={downloadExcel} className="p-1.5 bg-emerald-800 hover:bg-emerald-600 text-emerald-100 rounded border border-emerald-700 shadow-lg" title="Завантажити звіт в Excel (сирі дані + діаграма)">
                            <Icon name="table" className="w-4 h-4" />
                        </button>
                        <button onClick={downloadImage} className="p-1.5 bg-tactical-800 hover:bg-tactical-600 text-tactical-200 hover:text-white rounded border border-tactical-700 shadow-lg" title="Завантажити графік як зображення (PNG)">
                            <Icon name="download" className="w-4 h-4" />
                        </button>
                    </div>
                </div>
            );
        }, (prev, next) => {
            return JSON.stringify(prev.data) === JSON.stringify(next.data) &&
                   JSON.stringify(prev.options) === JSON.stringify(next.options) &&
                   prev.type === next.type && prev.showLabels === next.showLabels && prev.showPercentages === next.showPercentages;
        });

        // --- ДОПОМІЖНІ ФУНКЦІЇ ---
        const calculateWaitTimeUI = (dateStr) => {
            const start = new Date(dateStr);
            const diffMs = new Date() - start;
            if (diffMs < 0) return "Щойно";
            const hours = Math.floor(diffMs / (1000 * 60 * 60));
            return hours >= 24 ? `${Math.floor(hours / 24)}д ${hours % 24}г` : `${hours} год`;
        };

        const getBadgeColors = (lossType, severity) => {
            if (lossType === "Загибель (200)") return "bg-zinc-900 text-zinc-300 border-zinc-700";
            if (lossType === "Небойова смерть (200)") return "bg-stone-900 text-stone-300 border-stone-700";
            if (lossType === "Зниклий безвісти (ЗБВ)") return "bg-blue-950 text-blue-300 border-blue-800";
            if (lossType === "СЗЧ") return "bg-fuchsia-950 text-fuchsia-300 border-fuchsia-800";
            if (lossType === "Дезертирство") return "bg-pink-950 text-pink-300 border-pink-800";
            if (severity === "Критичний") return "bg-purple-950 text-purple-300 border-purple-800 animate-pulse";
            if (severity === "Важкий") return "bg-red-950 text-red-400 border-red-800 animate-pulse";
            if (severity === "Середній") return "bg-amber-950 text-amber-300 border-amber-800";
            return "bg-emerald-950 text-emerald-300 border-emerald-800";
        };

        const getLogRowStyle = (action, details) => {
            const aLow = action.toLowerCase(), dLow = details.toLowerCase();
            if (aLow.includes("евак") || dLow.includes("евак")) return "bg-blue-950/40 border-blue-900/60 text-blue-200 hover:bg-blue-950/60";
            if (dLow.includes("200") || dLow.includes("збв") || dLow.includes("сзч") || dLow.includes("дезерт") || dLow.includes("загиб") || dLow.includes("смерть") || aLow.includes("видалення")) return "bg-red-950/40 border-red-900/60 text-red-200 hover:bg-red-950/60";
            if (dLow.includes("300") || dLow.includes("травм") || dLow.includes("поран") || dLow.includes("важк") || dLow.includes("критич")) return "bg-amber-950/30 border-amber-900/40 text-amber-200 hover:bg-amber-950/50";
            return "bg-tactical-900/20 border-tactical-800 text-tactical-300 hover:bg-tactical-900/30";
        };
        
        const getInjStrUI = (inj) => {
            if(!inj) return "";
            const d = {amputation:'Амп.', rupture:'Розрив', shrapnel:'Уламк.', bullet:'Кульове', fracture:'Перелом', burn:'Опік', akbt:'АКБТ', contusion:'Забій'};
            let p = [];
            Object.entries(inj).forEach(([rId, a]) => {
                let str = Object.keys(a).filter(k=>a[k]).map(k=>d[k]).join(', ');
                if(str) p.push(`${BODY_REGIONS.find(r=>r.id===rId)?.name||rId}: ${str}`);
            });
            return p.join(' | ');
        };

        // --- УНІВЕРСАЛЬНІ UI КОМПОНЕНТИ ---
        const FilterSection = ({ title, isOpen, toggle, children }) => (
            <div className="space-y-1">
                <div className="flex items-center justify-between cursor-pointer" onClick={toggle}>
                    <span className="text-[10px] text-tactical-400 font-bold uppercase block">{title}</span>
                    <Icon name={isOpen ? "chevron-up" : "chevron-down"} className="w-3.5 h-3.5 text-tactical-500" />
                </div>
                {isOpen && <div className="mt-1">{children}</div>}
            </div>
        );

        const CheckboxList = ({ items, selected, toggle, maxH = true }) => (
            <div className={`flex flex-col gap-1.5 bg-tactical-900/40 p-2 rounded border border-tactical-800 ${maxH ? 'max-h-32 overflow-y-auto' : ''}`}>
                {items.map(item => {
                    const key = typeof item === 'object' ? item.k : item;
                    const label = typeof item === 'object' ? item.l : item;
                    return (
                        <label key={key} className="flex items-center gap-2 text-xs cursor-pointer select-none">
                            <input type="checkbox" checked={selected.includes(key)} onChange={() => toggle(key)} className="rounded bg-tactical-950 border-tactical-700 text-tactical-500 focus:ring-0 w-3.5 h-3.5" />
                            <span className="text-tactical-200 line-clamp-1">{label}</span>
                        </label>
                    )
                })}
            </div>
        );

        function App() {
            const [isLoading, setIsLoading] = useState(true);
            const [soldiers, setSoldiers] = useState([]);
            const [episodes, setEpisodes] = useState([]);
            const [logs, setLogs] = useState([]);
            const logsRef = useRef([]);
            useEffect(() => { logsRef.current = logs; }, [logs]);
            const [settings, setSettings] = useState({
                ranks: DEFAULT_RANKS, units: DEFAULT_UNITS, sectors: DEFAULT_SECTORS, causes: DEFAULT_CAUSES
            });

            useEffect(() => {
                const loadData = async () => {
                    try {
                        let savedSoldiers = await localforage.getItem('med_soldiers_v3');
                        if (!savedSoldiers) {
                            const ls = localStorage.getItem('med_soldiers_v3') || localStorage.getItem('med_soldiers_v2');
                            savedSoldiers = ls ? JSON.parse(ls) : [];
                        }
                        
                        let savedEpisodes = await localforage.getItem('med_episodes_v3');
                        if (!savedEpisodes) {
                            const ls = localStorage.getItem('med_episodes_v3') || localStorage.getItem('med_episodes_v2');
                            savedEpisodes = ls ? JSON.parse(ls) : [];
                        }
                        
                        let savedLogs = await localforage.getItem('med_logs_v3');
                        if (!savedLogs) {
                            const ls = localStorage.getItem('med_logs_v3') || localStorage.getItem('med_logs_v2');
                            savedLogs = ls ? JSON.parse(ls) : [{ id: 'init', timestamp: new Date().toISOString(), action: 'Система', details: 'База створена' }];
                        }
                        
                        let savedSettings = await localforage.getItem('med_settings_v3');
                        if (!savedSettings) {
                            const ls = localStorage.getItem('med_settings_v3') || localStorage.getItem('med_settings_v2');
                            const oldParsed = ls ? JSON.parse(ls) : {};
                            savedSettings = {
                                ranks: oldParsed.ranks || DEFAULT_RANKS, units: oldParsed.units || DEFAULT_UNITS,
                                sectors: oldParsed.sectors || DEFAULT_SECTORS, causes: oldParsed.causes || DEFAULT_CAUSES
                            };
                        }

                        setSoldiers(savedSoldiers || []);
                        setEpisodes(savedEpisodes || []);
                        setLogs(savedLogs?.slice(0, 200) || []);
                        setSettings(savedSettings);
                        setIsLoading(false);
                    } catch (e) {
                        console.error("Помилка завантаження бази", e);
                        setIsLoading(false);
                    }
                };
                loadData();
            }, []);

            const [activeTab, setActiveTab] = useState("list");
            const [showOnlyLatest, setShowOnlyLatest] = useState(true);

            const [filterLossTypes, setFilterLossTypes] = useState([...LOSS_TYPES]);
            const [filterSeverities, setFilterSeverities] = useState(["Легкий", "Середній", "Важкий", "Критичний"]);
            const [filterEvacStatuses, setFilterEvacStatuses] = useState(["Не евакуйований", "Евакуйований", "Не потребує евакуації", "В розшуку", "Повернувся"]);
            const [filterCauses, setFilterCauses] = useState(() => settings.causes);
            const [searchTerm, setSearchTerm] = useState("");
            const [filterUdp, setFilterUdp] = useState("all");
            const [listDateFrom, setListDateFrom] = useState("");
            const [listDateTo, setListDateTo] = useState("");
            
            const [history, setHistory] = useState([]);

            const undoAction = useCallback(() => {
                setHistory(prev => {
                    if (prev.length === 0) {
                        setTimeout(() => triggerNotification("Немає дій для скасування", "error"), 0);
                        return prev;
                    }
                    const lastState = prev[prev.length - 1];
                    setTimeout(() => {
                        setSoldiers(lastState.soldiers);
                        setEpisodes(lastState.episodes);
                        // Позначаємо закресленими всі логи, що були додані після снапшоту
                        const topId = lastState.topLogId; // null = до будь-якого логу, undefined = стара запис
                        setLogs(currentLogs => {
                            if (topId === undefined) return currentLogs; // стара історія без topLogId
                            let passedAnchor = (topId === null); // null = всі логи після снапшоту
                            return currentLogs.map(log => {
                                if (!passedAnchor) {
                                    // логи що йдуть до topId (новішіці, бо logs в зворотному порядку) — це і є скасовані
                                    if (log.id === topId) { passedAnchor = true; return log; }
                                    return { ...log, undone: true };
                                }
                                return log;
                            });
                        });
                        triggerNotification("Останню дію скасовано (Ctrl+Z)", "success");
                    }, 0);
                    return prev.slice(0, -1);
                });
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.ctrlKey && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я' || e.code === 'KeyZ')) {
                        if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
                        e.preventDefault();
                        undoAction();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [undoAction]);

            const saveHistory = () => {
                // Читаємо topLogId через ref — без вкладених setState
                const topLogId = logsRef.current.length > 0 ? logsRef.current[0].id : null;
                setHistory(prev => {
                    const newHist = [...prev, { 
                        soldiers: JSON.parse(JSON.stringify(soldiers)), 
                        episodes: JSON.parse(JSON.stringify(episodes)),
                        topLogId
                    }];

            const SEVERITY_COLORS = {

            const addLog = (action, details) => {

            const timeFilteredEpisodes = useMemo(() => {
                return episodes.filter(ep => {

                });
            }, [episodes, listDateFrom, listDateTo]);

            const latestEpisodesData = useMemo(() => {
                const map = new Map();
                [...timeFilteredEpisodes].sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(ep => {
                    map.set(ep.soldierId, ep);
                });

            }, [timeFilteredEpisodes]);

            const activeDataSource = showOnlyLatest ? latestEpisodesData : timeFilteredEpisodes;

            const roundTime = (timeStr) => {
                if(!timeStr) return "00:00";
                let [h, m] = timeStr.split(':').map(Number);
                if (m >= 30) h = (h + 1) % 24;
                return `${h.toString().padStart(2, '0')}:00`;
            };

            const stats = useMemo(() => {
                const totalEpisodes = timeFilteredEpisodes.length;
                const uniqueSoldiersCount = latestEpisodesData.length;
                
                const activeEvacNeed300 = latestEpisodesData.filter(e => e.evacStatus === "Не евакуйований" && isAny300(e.lossType)).length;
                const activeEvacNeed200_MIA = latestEpisodesData.filter(e => e.evacStatus === "Не евакуйований" && (e.lossType === 'Загибель (200)' || e.lossType === 'Небойова смерть (200)' || e.lossType === 'Зниклий безвісти (ЗБВ)')).length;
                
                const deadCount = latestEpisodesData.filter(e => e.lossType === 'Загибель (200)' || e.lossType === 'Небойова смерть (200)').length;
                const miaCount = latestEpisodesData.filter(e => e.lossType === 'Зниклий безвісти (ЗБВ)').length;
                const awolCount = latestEpisodesData.filter(e => isAwol(e.lossType) && e.awolStatus === 'В розшуку').length;
                
                return { totalEpisodes, uniqueSoldiersCount, activeEvacNeed300, activeEvacNeed200_MIA, deadCount, miaCount, awolCount };
            }, [timeFilteredEpisodes, latestEpisodesData]);

            const evacStats = useMemo(() => {
                let fromDateStr = anDateFrom ? anDateFrom.substring(0, 10) : ""; 
                let toDateStr = anDateTo ? anDateTo.substring(0, 10) : "";       
                
                let allEpisodes = episodes;
                if (anShowLatest) {
                    const map = new Map();
                    [...episodes].sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(ep => map.set(ep.soldierId, ep));
                    allEpisodes = Array.from(map.values());
                }

                let actualEvacuatedInPeriod = 0; 
                let evacWoundedInPeriod = 0;     
                let evacWoundedBefore = 0;       
                
                let totalWoundedInPeriod = 0;    
                let woundedInPeriodAndEvacuated = 0; 
                let woundedInPeriodWaiting = 0;  
                let woundedInPeriodNotNeeded = 0;

                allEpisodes.forEach(ep => {
                    const isLoss = isAny300(ep.lossType) || isAny200(ep.lossType) || ep.lossType === 'Зниклий безвісти (ЗБВ)';
                    if (!isLoss) return; 

                    const epDateObj = new Date(ep.date);
                    const isWoundInPeriod = (!anDateFrom || epDateObj >= new Date(anDateFrom)) && (!anDateTo || epDateObj <= new Date(anDateTo));
                    
                    if (isWoundInPeriod) {
                        totalWoundedInPeriod++;
                        if (ep.evacStatus === 'Евакуйований') woundedInPeriodAndEvacuated++;
                        else if (ep.evacStatus === 'Не евакуйований') woundedInPeriodWaiting++;
                        else if (ep.evacStatus === 'Не потребує евакуації') woundedInPeriodNotNeeded++;
                    }

                    if (ep.evacStatus === 'Евакуйований' && ep.evacTime) {
                        const isEvacInPeriod = (!fromDateStr || ep.evacTime >= fromDateStr) && (!toDateStr || ep.evacTime <= toDateStr);
                        if (isEvacInPeriod) {
                            actualEvacuatedInPeriod++;
                            if (isWoundInPeriod) {
                                evacWoundedInPeriod++;
                            } else if (fromDateStr && epDateObj < new Date(anDateFrom)) {
                                evacWoundedBefore++;
                            }
                        }
                    }
                });

                return { 
                    actualEvacuatedInPeriod, evacWoundedInPeriod, evacWoundedBefore,
                    totalWoundedInPeriod, woundedInPeriodAndEvacuated, woundedInPeriodWaiting, woundedInPeriodNotNeeded
                };
            }, [episodes, anDateFrom, anDateTo, anShowLatest]);

            const anFilteredEpisodes = useMemo(() => {
                let filtered = episodes.filter(ep => {
                    if (anDateFrom && new Date(ep.date) < new Date(anDateFrom)) return false;
                    if (anDateTo && new Date(ep.date) > new Date(anDateTo)) return false;
                    if (anUdp !== "all") {
                        if (anUdp === "yes" && !ep.inUdp) return false;
                        if (anUdp === "no" && ep.inUdp) return false;
                    }
                    return true;
                });
                if (anShowLatest) {
                    const map = new Map();
                    filtered.sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(ep => map.set(ep.soldierId, ep));
                    filtered = Array.from(map.values()).sort((a, b) => new Date(b.date) - new Date(a.date));
                }
                return filtered;
            }, [episodes, anDateFrom, anDateTo, anUdp, anShowLatest]);

            const chartData = useMemo(() => {
                const anFiltered = anFilteredEpisodes;

                // Ініціалізація карти часу (24 години)
                const timeMap = {};
                for (let i = 0; i < 24; i++) {
                    const hr = i.toString().padStart(2, '0') + ":00";
                    timeMap[hr] = { '200': 0, 'Неб. смерть': 0, 'Поранення': 0, 'Бойове': 0, 'Небойове': 0, 'ЗБВ': 0, 'СЗЧ': 0, 'Дезертирство': 0 };
                }
                
                let c200 = 0, c200nc = 0, cWound = 0, cCombat = 0, cNonCombat = 0, cMia = 0, cAwol = 0, cDesert = 0;
                const dGroups = {};
                const rCounts = {};
                const uCounts = {};
                const sevCounts = {};
                const aLocCounts = {};
                const aLocSevCounts = {};
                const aLocCauseCounts = {}; 
                const activeCausesSet = new Set();
                
                const injuryStats = { 'Ампутація':0, 'Розрив':0, 'Уламкове':0, 'Кульове':0, 'Перелом':0, 'Опік':0, 'АКБТ':0, 'Забій':0 };

                const evacDaysSum = { 'Критичний': 0, 'Важкий': 0, 'Середній': 0, 'Легкий': 0, '200 (Тіла)': 0 };
                const evacDaysCount = { 'Критичний': 0, 'Важкий': 0, 'Середній': 0, 'Легкий': 0, '200 (Тіла)': 0 };

                let evac200 = 0, evac300 = 0, notEvac200 = 0, notEvac300 = 0;

                anFiltered.forEach(d => {
                    let effType = d.lossType;
                    if (groupAnalytics) {
                        if (effType === 'Зниклий безвісти (ЗБВ)') effType = 'Загибель (200)';
                        if (effType === 'Бойове травмування (300)') effType = 'Поранення (300)';
                    }

                    const isEp200 = isAny200(effType) || effType === 'Зниклий безвісти (ЗБВ)';
                    const isEp300 = isAny300(effType);
                    
                    if (d.evacStatus === 'Евакуйований') {
                        if (isEp200) evac200++;
                        if (isEp300) evac300++;
                    } else if (d.evacStatus === 'Не евакуйований') {
                        if (isEp200) notEvac200++;
                        if (isEp300) notEvac300++;
                    }

                    const epTime = d.date.split('T')[1] || "00:00"; 
                    const roundedHhMm = roundTime(epTime.substring(0, 5));
                    
                    const day = d.date.split('T')[0];
                    if (!dGroups[day]) dGroups[day] = { '200': 0, 'Неб. смерть': 0, 'Поранення': 0, 'Бойове': 0, 'Небойове': 0, 'ЗБВ': 0, 'СЗЧ': 0, 'Дезертирство': 0 };

                    let typeKey = '';
                    if (effType === 'Загибель (200)') { typeKey = '200'; c200++; }
                    else if (effType === 'Небойова смерть (200)') { typeKey = 'Неб. смерть'; c200nc++; }
                    else if (effType === 'Поранення (300)') { typeKey = 'Поранення'; cWound++; }
                    else if (effType === 'Бойове травмування (300)') { typeKey = 'Бойове'; cCombat++; }
                    else if (effType === 'Небойове травмування (300)') { typeKey = 'Небойове'; cNonCombat++; }
                    else if (effType === 'Зниклий безвісти (ЗБВ)') { typeKey = 'ЗБВ'; cMia++; }
                    else if (effType === 'СЗЧ') { typeKey = 'СЗЧ'; cAwol++; }
                    else if (effType === 'Дезертирство') { typeKey = 'Дезертирство'; cDesert++; }

                    if (typeKey) {
                        if (timeMap[roundedHhMm]) timeMap[roundedHhMm][typeKey]++;
                        dGroups[day][typeKey]++;
                    }

                    const soldier = soldiers.find(s => s.id === d.soldierId);
                    const unit = d.unit || (soldier && soldier.unit ? soldier.unit : 'Невідомо');
                    const causeStr = d.cause || 'Не вказано';
                    if (d.cause) activeCausesSet.add(d.cause);
                    
                    if (!uCounts[unit]) uCounts[unit] = { '200':0, 'Неб. смерть':0, 'Поранення':0, 'Бойове':0, 'Небойове':0, 'ЗБВ':0, 'СЗЧ':0, 'Дезертирство':0 };
                    if (typeKey) uCounts[unit][typeKey]++;

                    if (!rCounts[causeStr]) rCounts[causeStr] = { '200':0, 'Неб. смерть':0, 'Поранення':0, 'Бойове':0, 'Небойове':0, 'ЗБВ':0, 'СЗЧ':0, 'Дезертирство':0 };
                    if (typeKey) rCounts[causeStr][typeKey]++;

                    if (isAny300(d.lossType) && d.severity) sevCounts[d.severity] = (sevCounts[d.severity] || 0) + 1;
                    
                    const loc = d.actualLoc || 'Не вказано';
                    
                    if (!aLocCounts[loc]) aLocCounts[loc] = { '200':0, 'Неб. смерть':0, 'Поранення':0, 'Бойове':0, 'Небойове':0, 'ЗБВ':0, 'СЗЧ':0, 'Дезертирство':0 };
                    if (typeKey) aLocCounts[loc][typeKey]++;

                    if (isAny300(d.lossType) && d.severity) {
                        if (!aLocSevCounts[loc]) aLocSevCounts[loc] = { 'Легкий':0, 'Середній':0, 'Важкий':0, 'Критичний':0 };
                        aLocSevCounts[loc][d.severity]++;
                    }

                    if (!aLocCauseCounts[loc]) aLocCauseCounts[loc] = {};
                    if (!aLocCauseCounts[loc][causeStr]) aLocCauseCounts[loc][causeStr] = 0;
                    aLocCauseCounts[loc][causeStr]++;

                    if (d.injuries) {
                        let epInjs = { 'Ампутація':false, 'Розрив':false, 'Уламкове':false, 'Кульове':false, 'Перелом':false, 'Опік':false, 'АКБТ':false, 'Забій':false };
                        Object.values(d.injuries).forEach(reg => {
                            if(reg.amputation) epInjs['Ампутація'] = true;
                            if(reg.rupture) epInjs['Розрив'] = true;
                            if(reg.shrapnel) epInjs['Уламкове'] = true;
                            if(reg.bullet) epInjs['Кульове'] = true;
                            if(reg.fracture) epInjs['Перелом'] = true;
                            if(reg.burn) epInjs['Опік'] = true;
                            if(reg.akbt) epInjs['АКБТ'] = true;
                            if(reg.contusion) epInjs['Забій'] = true;
                        });
                        Object.keys(epInjs).forEach(k => { if(epInjs[k]) injuryStats[k]++; });
                    }

                    if (d.evacStatus === "Евакуйований" && d.evacTime) {
                        const epDate = new Date(d.date.split('T')[0]); 
                        const evDate = new Date(d.evacTime);
                        let diffDays = Math.max(0, Math.floor((evDate - epDate) / (1000 * 60 * 60 * 24)));

                        if (isAny200(d.lossType)) {
                            evacDaysSum['200 (Тіла)'] += diffDays;
                            evacDaysCount['200 (Тіла)']++;
                        } else if (isAny300(d.lossType) && d.lossType !== 'Небойове травмування (300)') {
                            if (d.severity && evacDaysSum[d.severity] !== undefined) {
                                evacDaysSum[d.severity] += diffDays;
                                evacDaysCount[d.severity]++;
                            }
                        }
                    }
                });

                const activeDates = Object.keys(dGroups).sort();
                if (activeDates.length > 0) {
                    // Визначаємо початок і кінець в мілісекундах (в UTC для уникнення зсувів часового поясу)
                    const startMs = new Date(activeDates[0] + "T00:00:00Z").getTime();
                    const endMs = new Date(activeDates[activeDates.length - 1] + "T00:00:00Z").getTime();
                    
                    // Крокуємо по 24 години (86400000 мс)
                    for (let t = startMs; t <= endMs; t += 86400000) {
                        const dateStr = new Date(t).toISOString().split('T')[0];
                        // Якщо дати немає в масиві, створюємо її з нульовими показниками
                        if (!dGroups[dateStr]) {
                            dGroups[dateStr] = { '200': 0, 'Неб. смерть': 0, 'Поранення': 0, 'Бойове': 0, 'Небойове': 0, 'ЗБВ': 0, 'СЗЧ': 0, 'Дезертирство': 0 };
                        }
                    }
                }

                const sortByTotal = (obj) => {
                    return Object.keys(obj).sort((a, b) => {
                        const sumA = Object.values(obj[a]).reduce((acc, val) => acc + val, 0);
                        const sumB = Object.values(obj[b]).reduce((acc, val) => acc + val, 0);
                        return sumB - sumA;
                    });
                };

                const evacLabels = ['Критичний', 'Важкий', 'Середній', 'Легкий', '200 (Тіла)'];
                const evacChartDataConfig = {
                    labels: evacLabels,
                    datasets: [{
                        label: 'Середній час (днів)',
                        data: evacLabels.map(l => evacDaysCount[l] > 0 ? (evacDaysSum[l] / evacDaysCount[l]).toFixed(1) : 0),
                        backgroundColor: ['#a855f7', '#ef4444', '#f59e0b', '#10b981', '#71717a'],
                        borderRadius: 4
                    }]
                };

                const evacStatusData = {
                    labels: ['Евакуйовані', 'В черзі (Не евак.)'],
                    datasets: [
                        { label: '200 / ЗБВ', data: [evac200, notEvac200], backgroundColor: '#71717a' },
                        { label: '300 (Всі)', data: [evac300, notEvac300], backgroundColor: '#ef4444' }
                    ]
                };

                const sortedLocs = sortByTotal(aLocCounts);
                const activeCauses = Array.from(activeCausesSet);
                
                const causeColors = {};
                settings.causes.forEach((c, i) => { causeColors[c] = CHART_COLORS[i % CHART_COLORS.length]; });
                let extraIdx = settings.causes.length;
                activeCauses.forEach(c => {
                    if (!causeColors[c]) { causeColors[c] = CHART_COLORS[extraIdx % CHART_COLORS.length]; extraIdx++; }
                });

                const locCauseDatasets = activeCauses.map((cause) => ({
                    label: cause,
                    data: sortedLocs.map(l => aLocCauseCounts[l][cause] || 0),
                    backgroundColor: causeColors[cause]
                }));

                const sortedReasons = sortByTotal(rCounts);

                return {
                    totalEpisodes: anFiltered.length,
                    time: { labels: Object.keys(timeMap).sort(), timeMap },
                    types: { c200, c200nc, cWound, cCombat, cNonCombat, cMia, cAwol, cDesert },
                    dynamics: { dates: Object.keys(dGroups).sort(), dGroups },
                    units: { labels: sortByTotal(uCounts), data: uCounts },
                    reasons: { labels: sortedReasons, data: rCounts },
                    severity: Object.keys(sevCounts).length ? sevCounts : { 'Дані відсутні': 1 },
                    actLocs: { labels: sortedLocs, data: aLocCounts },
                    actLocsSev: { labels: sortByTotal(aLocSevCounts), data: aLocSevCounts },
                    locCause: { labels: sortedLocs, datasets: locCauseDatasets },
                    injuryStats,
                    evacChartDataConfig,
                    evacStatusData,
                    causeColors
                };
            }, [anFilteredEpisodes, soldiers, groupAnalytics]);

            const handleExportAnalyticsExcel = async () => {
                if (typeof ExcelJS === 'undefined') {
                    triggerNotification("Бібліотека ExcelJS ще не завантажилась. Перевірте з'єднання з Інтернетом.", "error");
                    return;
                }
                const workbook = new ExcelJS.Workbook();
                workbook.creator = 'MedTactical';
                workbook.lastModifiedBy = 'System';
                workbook.created = new Date();
                
                const sheet1 = workbook.addWorksheet('Загальна статистика');
                sheet1.columns = [
                    { header: 'Всього епізодів', key: 'total', width: 20 },
                    { header: 'Бойові (200)', key: 'c200', width: 15 },
                    { header: 'Небойові (200)', key: 'c200nc', width: 15 },
                    { header: 'Поранення (300)', key: 'cWound', width: 20 },
                    { header: 'Бойові травми', key: 'cCombat', width: 15 },
                    { header: 'Небойові травми', key: 'cNonCombat', width: 20 },
                    { header: 'ЗБВ', key: 'cMia', width: 10 },
                    { header: 'СЗЧ', key: 'cAwol', width: 10 },
                    { header: 'Дезертирство', key: 'cDesert', width: 15 }
                ];
                sheet1.getRow(1).font = { bold: true };
                sheet1.addRow({
                    total: chartData.totalEpisodes, c200: chartData.types.c200, c200nc: chartData.types.c200nc,
                    cWound: chartData.types.cWound, cCombat: chartData.types.cCombat, cNonCombat: chartData.types.cNonCombat,
                    cMia: chartData.types.cMia, cAwol: chartData.types.cAwol, cDesert: chartData.types.cDesert
                });

                const sheet2 = workbook.addWorksheet('Дані для графіків');
                sheet2.columns = [
                    { header: 'Тип втрати', key: 'tL', width: 20 }, { header: 'К-сть', key: 'tC', width: 10 }, { header: '', key: 's1', width: 5 },
                    { header: 'Підрозділ', key: 'uL', width: 25 }, { header: 'К-сть', key: 'uC', width: 10 }, { header: '', key: 's2', width: 5 },
                    { header: 'Причина', key: 'cL', width: 25 }, { header: 'К-сть', key: 'cC', width: 10 }, { header: '', key: 's3', width: 5 },
                    { header: 'Час доби', key: 'timeL', width: 15 }, { header: 'К-сть', key: 'timeC', width: 10 }
                ];
                sheet2.getRow(1).font = { bold: true };

                const tC = [chartData.types.c200, chartData.types.c200nc, chartData.types.cCombat, chartData.types.cNonCombat, chartData.types.cWound, chartData.types.cMia, chartData.types.cAwol, chartData.types.cDesert];

                                            <div>
                                                <label className="text-[10px] text-tactical-400 font-bold uppercase block mb-1">Час події</label>
                                                <input type="datetime-local" value={episodeDate} onChange={(e) => setEpisodeDate(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs font-mono text-white" />
                                            </div>
                                            
                                            <label className="flex items-center gap-2 text-xs font-bold text-red-400 border border-red-900/50 bg-red-950/20 p-2 rounded cursor-pointer select-none">
                                                <input type="checkbox" checked={inUdp} onChange={(e) => setInUdp(e.target.checked)} className="bg-tactical-950 border-tactical-700 text-red-600 rounded focus:ring-0" />
                                                Отримано під час УПД
                                            </label>

                                            <div>
                                                <label className="text-[10px] text-tactical-400 font-bold uppercase block mb-1">Фактичне місце отримання</label>
                                                <input list="locs-list" placeholder="Оберіть або введіть своє..." value={actualLoc} onChange={(e) => setActualLoc(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs text-white" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-tactical-400 font-bold uppercase block mb-1">Документальне місце</label>
                                                <input list="locs-list" placeholder="Оберіть або введіть своє..." value={docLoc} onChange={(e) => setDocLoc(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs text-white" />
                                                <datalist id="locs-list">
                                                    {settings.sectors.map((s, i) => <option key={i} value={s}/>)}
                                                </datalist>
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-tactical-400 font-bold uppercase block mb-1">Опис / Нотатки</label>
                                                <textarea rows="2" value={notes} onChange={(e) => setNotes(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs text-white"></textarea>
                                            </div>
                                        </div>

                                        {!isAwol(lossType) && lossType !== "Зниклий безвісти (ЗБВ)" && (
                                            <div className="bg-tactical-900/40 border border-tactical-800 p-3 rounded-lg space-y-3">
                                                <div>
                                                    <label className="text-[10px] text-tactical-400 font-bold uppercase block mb-1">Статус евакуації</label>
                                                    <select value={evacStatus} onChange={(e) => setEvacStatus(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs text-white">
                                                        <option value="Не евакуйований">Не евакуйований</option>
                                                        <option value="Евакуйований">Евакуйований</option>
                                                        <option value="Не потребує евакуації">Не потребує евакуації</option>
                                                    </select>
                                                </div>
                                                {evacStatus === "Евакуйований" && (
                                                    <div>
                                                        <label className="text-[10px] text-tactical-400 font-bold uppercase block mb-1">Дата евакуації (по замовч. = сьогодні)</label>
                                                        <input type="date" value={evacDate} onChange={(e) => setEvacDate(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs font-mono text-white" />
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {isAwol(lossType) && (
                                            <div className="bg-fuchsia-950/20 border border-fuchsia-900/50 p-3 rounded-lg space-y-3">
                                                <div>
                                                    <label className="text-[10px] text-fuchsia-400 font-bold uppercase block mb-1">Статус {lossType}</label>
                                                    <select value={awolStatus} onChange={(e) => setAwolStatus(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs text-white">
                                                        <option value="В розшуку">В розшуку</option>
                                                        <option value="Повернувся">Повернувся</option>
                                                    </select>
                                                </div>
                                                {awolStatus === "Повернувся" && (
                                                    <div>
                                                        <label className="text-[10px] text-tactical-400 font-bold uppercase block mb-1">Дата повернення (по замовч. = сьогодні)</label>
                                                        <input type="date" value={evacDate} onChange={(e) => setEvacDate(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs font-mono text-white" />
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        <div className="bg-tactical-900/40 border border-tactical-800 p-3 rounded-lg space-y-3">
                                            <label className="flex items-center gap-2 text-xs font-semibold text-tactical-200 cursor-pointer select-none">
                                                <input type="checkbox" checked={hasReport} onChange={(e) => {
                                                    setHasReport(e.target.checked);
                                                    if(!e.target.checked) setWeaponStatus("");
                                                }} className="rounded bg-tactical-950 border-tactical-700 text-tactical-500 focus:ring-0 w-3.5 h-3.5"/> 
                                                Складено рапорт
                                            </label>
                                            {hasReport && (
                                                <div className="space-y-3 pl-6 border-l-2 border-tactical-800 mt-2">
                                                    <div>
                                                        <label className="text-[10px] text-tactical-400 font-bold uppercase block mb-1">Дата рапорту (якщо пусто = сьогодні)</label>
                                                        <input type="date" value={reportDate} onChange={(e) => setReportDate(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs font-mono text-white" />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] text-tactical-400 font-bold uppercase block mb-1 flex items-center gap-1"><Icon name="crosshair" className="w-3 h-3" /> Статус зброї</label>
                                                        <select value={weaponStatus} onChange={(e) => setWeaponStatus(e.target.value)} className="w-full bg-tactical-950 border border-tactical-800 rounded px-2 py-1.5 text-xs text-white">
                                                            <option value="">-- Все ок / Не вказувати --</option>
                                                            <option value="втрачена">Втрачена</option>
                                                            <option value="знищена">Знищена</option>
                                                            <option value="знаходиться у підрозділі">Знаходиться у підрозділі</option>
                                                            <option value="знаходиться на позиції">Знаходиться на позиції</option>
                                                            <option value="СЗЧ/Дезертирство зі зброєю">СЗЧ/Дезертирство зі зброєю</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {isAny300(lossType) ? (
                                        <div className="lg:col-span-4 bg-tactical-900/20 border border-tactical-800 rounded-lg p-3 flex flex-col items-center">
                                            <span className="text-[10px] font-bold uppercase text-tactical-400 mb-2">Локалізація травм (Тіло)</span>
                                            <div className="relative w-[140px] aspect-[1/2] border border-tactical-800/40 rounded bg-tactical-950/80 p-1 mb-4">
                                                <svg viewBox="0 0 200 350" className="w-full h-full text-tactical-700">
                                                    <circle cx="100" cy="35" r="18" fill={hasAnyInjury('head') ? '#ef4444' : '#4d6c2f'} stroke="#e5ebd9" onClick={() => setSelectedRegion('head')} className="cursor-pointer hover:opacity-80"/>
                                                    <rect x="94" y="53" width="12" height="15" rx="3" fill={hasAnyInjury('neck') ? '#ef4444' : '#4d6c2f'} stroke="#e5ebd9" onClick={() => setSelectedRegion('neck')} className="cursor-pointer hover:opacity-80"/>
                                                    <path d="M75,68 L125,68 L120,135 L80,135 Z" fill={hasAnyInjury('chest') ? '#ef4444' : '#4d6c2f'} stroke="#e5ebd9" onClick={() => setSelectedRegion('chest')} className="cursor-pointer hover:opacity-80"/>
                                                    <path d="M80,135 L120,135 L115,180 L85,180 Z" fill={hasAnyInjury('abdomen') ? '#ef4444' : '#4d6c2f'} stroke="#e5ebd9" onClick={() => setSelectedRegion('abdomen')} className="cursor-pointer hover:opacity-80"/>
                                                    <path d="M72,70 L55,75 L45,140 L55,145 L68,100 Z" fill={hasAnyInjury('arm_l') ? '#ef4444' : '#4d6c2f'} stroke="#e5ebd9" onClick={() => setSelectedRegion('arm_l')} className="cursor-pointer hover:opacity-80"/>
                                                    <path d="M128,70 L145,75 L155,140 L145,145 L132,100 Z" fill={hasAnyInjury('arm_r') ? '#ef4444' : '#4d6c2f'} stroke="#e5ebd9" onClick={() => setSelectedRegion('arm_r')} className="cursor-pointer hover:opacity-80"/>
                                                    <path d="M83,180 L70,320 L92,320 L98,220 Z" fill={hasAnyInjury('leg_l') ? '#ef4444' : '#4d6c2f'} stroke="#e5ebd9" onClick={() => setSelectedRegion('leg_l')} className="cursor-pointer hover:opacity-80"/>
                                                    <path d="M117,180 L130,320 L108,320 L102,220 Z" fill={hasAnyInjury('leg_r') ? '#ef4444' : '#4d6c2f'} stroke="#e5ebd9" onClick={() => setSelectedRegion('leg_r')} className="cursor-pointer hover:opacity-80"/>
                                                </svg>
                                            </div>
                                            <div className="w-full bg-tactical-950 p-2 rounded border border-tactical-800">
                                                <div className="text-[10px] font-bold text-white uppercase border-b border-tactical-800 pb-1 mb-2">Зона: {BODY_REGIONS.find(r => r.id === selectedRegion)?.name}</div>
                                                <div className="grid grid-cols-2 gap-1.5">
                                                    {[{key:'amputation', label:'Ампутація'}, {key:'rupture', label:'Розрив'}, {key:'shrapnel', label:'Уламкове'}, {key:'bullet', label:'Кульове'}, {key:'fracture', label:'Перелом'}, {key:'burn', label:'Опік'}, {key:'akbt', label:'АКБТ'}, {key:'contusion', label:'Забій'}].map(i => (
                                                        <label key={i.key} className="flex justify-between items-center p-1.5 border border-tactical-800 rounded bg-tactical-900/50 text-[10px] cursor-pointer select-none">
                                                            <span>{i.label}</span>
                                                            <input type="checkbox" checked={injuries[selectedRegion]?.[i.key] || false} onChange={() => toggleInjuryType(selectedRegion, i.key)} className="rounded bg-tactical-950 border-tactical-700 text-red-600 focus:ring-0 w-3.5 h-3.5"/>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="lg:col-span-4 bg-zinc-900/20 border border-zinc-800/50 rounded-lg p-3 flex flex-col items-center justify-center text-zinc-500 text-xs text-center">
                                            <Icon name="info" className="w-10 h-10 mb-2 opacity-50" />
                                            Для обраного типу події травми не фіксуються
                                        </div>
                                    )}
                                </div>
                                
                                <div className="px-4 py-3 bg-tactical-900/80 border-t border-tactical-800 flex items-center justify-between shrink-0">
                                    <div>
                                        {isEditOpen && (
                                            confirmDelete ? (
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xs text-red-400 font-bold">Дійсно видалити з реєстру?</span>
                                                    <button type="button" onClick={handleDeleteEpisode} className="px-3 py-1 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded">Так, видалити</button>
                                                    <button type="button" onClick={() => setConfirmDelete(false)} className="px-3 py-1 bg-tactical-800 hover:bg-tactical-700 text-white text-xs rounded transition">Скасувати</button>
                                                </div>
                                            ) : (
                                                <button type="button" onClick={() => setConfirmDelete(true)} className="px-3 py-1.5 bg-red-950/40 hover:bg-red-900/80 text-red-400 border border-red-900/50 text-xs font-bold rounded transition">Видалити запис</button>
                                            )
                                        )}
                                    </div>
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => {setIsAddWoundedOpen(false); setIsEditOpen(false);}} className="px-4 py-1.5 bg-tactical-800 hover:bg-tactical-700 text-tactical-200 text-xs font-bold rounded">Скасувати</button>
                                        <button type="submit" className="px-5 py-1.5 bg-tactical-500 hover:bg-tactical-400 text-tactical-950 text-xs font-bold rounded shadow-lg">{isEditOpen ? 'Оновити' : 'Зберегти'}</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur flex items-center justify-center p-4">
                            <div className="bg-tactical-950 border border-tactical-800 w-full max-w-md rounded-xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="px-4 py-3 bg-tactical-900 border-b border-tactical-800 flex justify-between items-center shrink-0">
                                    <h3 className="font-bold text-white text-sm"><Icon name="settings" className="w-4 h-4 inline mr-1" /> Класифікатори довідників</h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-tactical-500 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
                                </div>
                                <div className="flex border-b border-tactical-800 text-[10px] font-bold uppercase shrink-0">
                                    {[{k:'causes', l:'Причини'}, {k:'ranks', l:'Звання'}, {k:'units', l:'Підрозд.'}, {k:'sectors', l:'Позиції'}].map(t => (
                                        <button key={t.k} onClick={() => setActiveSettingsTab(t.k)} className={`flex-1 py-2 text-center transition ${activeSettingsTab === t.k ? 'bg-tactical-900 text-tactical-200 border-b-2 border-tactical-500' : 'text-tactical-600'}`}>{t.l}</button>
                                    ))}
                                </div>
                                <div className="p-4 flex-1 overflow-hidden flex flex-col gap-3">
                                    <div className="flex gap-2 shrink-0">
                                        <input type="text" value={newSettingItem} onChange={(e) => setNewSettingItem(e.target.value)} placeholder="Нове значення..." className="flex-1 bg-tactical-900 border border-tactical-700 rounded px-2 py-1 text-xs text-white outline-none" />
                                        <button onClick={addSettingItem} className="px-3 py-1 bg-tactical-600 hover:bg-tactical-500 text-tactical-950 text-xs font-bold rounded">Додати</button>
                                    </div>
                                    <div className="flex-1 border border-tactical-800 bg-tactical-900/30 rounded overflow-y-auto">
                                        {(settings[activeSettingsTab] || []).map((item, idx) => (
                                            <div key={idx} className="flex justify-between items-center p-2 border-b border-tactical-800/50 text-xs text-tactical-200">
                                                <span>{item}</span>
                                                <button onClick={() => removeSettingItem(item)} className="text-red-500 hover:text-red-400"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isBackupOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur flex items-center justify-center p-4">
                            <div className="bg-tactical-950 border border-tactical-800 w-full max-w-lg rounded-xl overflow-hidden shadow-2xl">
                                <div className="px-4 py-3 bg-tactical-900 border-b border-tactical-800 flex justify-between items-center">
                                    <h3 className="font-bold text-white text-sm"><Icon name="shield" className="w-4 h-4 inline mr-1 text-amber-500" /> Управління базою та Бекапи</h3>
                                    <button onClick={() => setIsBackupOpen(false)} className="text-tactical-500 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
                                </div>
                                <div className="p-4 space-y-6">
                                    <div className="space-y-2 border-b border-tactical-800 pb-4">
                                        <div className="text-xs font-bold text-emerald-400 uppercase">Створити резервну копію (Експорт)</div>
                                        <input type="password" value={backupPassword} onChange={(e)=>setBackupPassword(e.target.value)} placeholder="Придумайте пароль для захисту файлу..." className="w-full bg-tactical-900 border border-tactical-700 rounded px-2 py-1.5 text-xs text-white outline-none focus:border-tactical-500" />
                                        <button onClick={handleExport} className="w-full py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white font-bold rounded text-xs transition">Завантажити зашифрований .enc файл</button>
                                    </div>
                                    <div className="space-y-2 border-b border-tactical-800 pb-4">
                                        <div className="text-xs font-bold text-blue-400 uppercase">Відновити з файлу (Імпорт)</div>
                                        <div className="flex items-center w-full bg-tactical-900 border border-tactical-700 rounded p-1">
                                            <input type="file" accept=".enc" onChange={handleFileChange} className="w-full text-xs text-tactical-300 outline-none file:mr-4 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-tactical-800 file:text-tactical-200 hover:file:bg-tactical-700 cursor-pointer" />
                                        </div>
                                        <input type="password" value={importPassword} onChange={(e)=>setImportPassword(e.target.value)} placeholder="Пароль для розшифрування файлу..." className="w-full bg-tactical-900 border border-tactical-700 rounded px-2 py-1.5 text-xs text-white outline-none focus:border-tactical-500" />
                                        <button onClick={handleImport} className="w-full py-1.5 bg-blue-800 hover:bg-blue-700 text-white font-bold rounded text-xs transition">Розшифрувати та відновити базу</button>
                                    </div>
                                    <div className="space-y-2 pt-2">
                                        <div className="text-xs font-bold text-red-500 uppercase flex items-center gap-1"><Icon name="alert-triangle" className="w-4 h-4" /> Небезпечна зона</div>
                                        <button onClick={() => setIsClearDbConfirmOpen(true)} className="w-full py-1.5 bg-red-950 hover:bg-red-900 border border-red-800 text-red-400 font-bold rounded text-xs transition">Повністю очистити поточну базу</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isClearDbConfirmOpen && (
                        <div className="fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-red-950 border border-red-800 w-full max-w-sm rounded-lg overflow-hidden shadow-2xl p-5 text-center">
                                <Icon name="alert-octagon" className="w-12 h-12 text-red-500 mx-auto mb-3" />
                                <h3 className="font-bold text-white text-lg mb-2">УВАГА! Очищення бази</h3>
                                <p className="text-xs text-red-200 mb-6">
                                    Це безповоротно видалить всіх військовослужбовців, події та логи. Ви впевнені, що хочете продовжити?
                                </p>
                                <div className="flex gap-3 justify-center">
                                    <button onClick={() => setIsClearDbConfirmOpen(false)} className="px-4 py-2 bg-tactical-800 hover:bg-tactical-700 text-white text-xs font-bold rounded transition">Скасувати</button>
                                    <button onClick={handleClearDatabase} className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded transition shadow-lg shadow-red-900">Так, очистити все</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
