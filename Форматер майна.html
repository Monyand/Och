<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форматер Майна</title>
    <style>
        /* Вбудовані стилі (працює без інтернету) */
        :root {
            --bg-body: #020617; 
            --bg-panel: #0f172a; 
            --bg-input: #1e293b; 
            --border-color: #334155; 
            --text-main: #cbd5e1; 
            --text-muted: #94a3b8; 
            --accent: #3b82f6; 
            --accent-hover: #2563eb; 
            --success: #10b981; 
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 2rem;
        }

        h1 {
            color: #ffffff;
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            height: calc(100vh - 150px);
            min-height: 500px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
                height: auto;
            }
            .panel { height: 400px; }
        }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .panel-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(30, 41, 59, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-weight: 600;
            margin: 0;
            font-size: 1rem;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 1rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            white-space: pre;
        }

        textarea:focus {
            box-shadow: inset 0 0 0 1px var(--border-color);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-input);
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--border-color);
            color: #60a5fa;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn.success {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .svg-icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Форматер Майна</h1>
            <p class="subtitle">Вставте брудний текст ліворуч — отримайте ідеальний шаблон праворуч. Працює 100% офлайн.</p>
        </div>

        <div class="grid">
            <!-- Ліва колонка -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title" style="color: #e2e8f0;">Сирі дані</h2>
                    <button id="btn-clear" class="btn" style="padding: 0.3rem 0.5rem; color: #f87171;" title="Очистити">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                    </button>
                </div>
                <textarea id="input-text" placeholder="Вставляйте сюди текст з будь-якими крапками, дефісами чи пробілами..."></textarea>
            </div>

            <!-- Права колонка -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title" style="color: var(--accent);">Відформатований результат</h2>
                    <button id="btn-copy" class="btn" disabled>
                        <svg class="svg-icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        <span id="copy-text">Копіювати</span>
                    </button>
                </div>
                <textarea id="output-text" readonly placeholder="Тут з'явиться ідеально чистий результат..."></textarea>
            </div>
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('input-text');
        const outputArea = document.getElementById('output-text');
        const btnCopy = document.getElementById('btn-copy');
        const btnClear = document.getElementById('btn-clear');
        const copyText = document.getElementById('copy-text');

        function formatData() {
            const rawText = inputArea.value;
            if (!rawText.trim()) {
                outputArea.value = '';
                btnCopy.disabled = true;
                return;
            }

            const lines = rawText.split('\n');
            const resultLines = [];

            lines.forEach(line => {
                let text = line.trim();
                if (!text) return; // Пропускаємо пусті рядки

                // 1. Прибираємо початкові маркери (тире, крапки, зірочки, маркери списку)
                text = text.replace(/^[-•*–—\s]+/, '');

                // 2. Шукаємо ОСТАННЄ входження кількості та одиниці виміру в рядку
                // Це дозволяє ігнорувати будь-який текст ПІСЛЯ одиниці виміру (наприклад, ПІБ, "втрачено", дужки)
                const qtyRegex = /[-\s–—]*(\d+(?:[.,]\d+)?)\s*(шт\.?|щт\.?|т\.?|пара|пар|пари|к-кт|к-т|комплект(?:и)?|од\.?)/gi;
                let lastMatch = null;
                let match;
                
                while ((match = qtyRegex.exec(text)) !== null) {
                    lastMatch = match;
                }
                
                if (lastMatch) {
                    const quantity = lastMatch[1];
                    let unit = lastMatch[2].toLowerCase().replace('.', '');
                    
                    // Нормалізуємо одиниці виміру
                    if (unit === 'шт' || unit === 'щт' || unit === 'т') unit = 'шт.';
                    else if (unit === 'пара' || unit === 'пар' || unit === 'пари') {
                        const q = parseInt(quantity, 10);
                        if (q === 1) unit = 'пара';
                        else if (q >= 2 && q <= 4) unit = 'пари';
                        else unit = 'пар';
                    }
                    else if (unit === 'к-кт' || unit === 'к-т' || unit === 'комплект' || unit === 'комплекти') {
                        unit = 'к-кт';
                    }
                    else if (unit === 'од') unit = 'од.';
                    
                    // Назва — це все, що було ДО знайденої кількості
                    let name = text.substring(0, lastMatch.index).trim();

                    // Додатково приберемо тире та коми в кінці назви, якщо вони там залишилися
                    name = name.replace(/[-–—\s:.,;]+$/, '');

                    // Формуємо фінальний рядок
                    resultLines.push(`${name} – ${quantity} ${unit};`);
                } else {
                    // Якщо не вдалося розпізнати як кількість+одиниця, робимо мінімальну очистку
                    text = text.replace(/[.;\s]+$/, '');
                    resultLines.push(`${text};`);
                }
            });

            outputArea.value = resultLines.join('\n');
            btnCopy.disabled = resultLines.length === 0;
        }

        // Слухачі подій
        inputArea.addEventListener('input', () => {
            formatData();
            localStorage.setItem('formatterData', inputArea.value);
        });

        btnClear.addEventListener('click', () => {
            if(confirm('Очистити всі дані?')) {
                inputArea.value = '';
                formatData();
                localStorage.removeItem('formatterData');
            }
        });

        btnCopy.addEventListener('click', () => {
            if (!outputArea.value) return;
            
            navigator.clipboard.writeText(outputArea.value).then(() => {
                copyText.textContent = "Скопійовано!";
                btnCopy.classList.add('success');
                setTimeout(() => {
                    copyText.textContent = "Копіювати";
                    btnCopy.classList.remove('success');
                }, 2000);
            }).catch(() => {
                outputArea.select();
                document.execCommand('copy');
                copyText.textContent = "Скопійовано!";
                btnCopy.classList.add('success');
                setTimeout(() => {
                    copyText.textContent = "Копіювати";
                    btnCopy.classList.remove('success');
                }, 2000);
            });
        });

        // Завантаження збережених даних
        inputArea.value = localStorage.getItem('formatterData') || '';
        formatData();
    </script>
</body>
</html>
