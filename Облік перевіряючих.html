<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парсер БЧС (БР та Об'єднані комірки)</title>
    <!-- SheetJS для читання Excel (XLSX, CSV) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- docx для створення Word файлів -->
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    
    <style>
        :root { --bg: #121212; --panel: #1e1e24; --accent: #ffb703; --text: #f8f9fa; --border: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: var(--bg); color: var(--text); margin: 0; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: var(--panel); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { text-align: center; color: var(--accent); margin-top: 0; margin-bottom: 5px; font-size: 28px; }
        p.subtitle { text-align: center; color: #aaa; margin: 0 auto 30px auto; font-size: 14px; max-width: 600px; }
        
        .panel { background: #25252b; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid var(--border); }
        .panel h3 { margin-top: 0; font-size: 16px; margin-bottom: 15px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .grid-settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 12px; margin-bottom: 6px; color: #9ca3af; font-weight: bold; }
        .input-group input { padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-weight: bold; text-align: center; outline: none; transition: 0.2s; font-size: 16px; }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 183, 3, 0.2); }
        .input-group input[type="text"] { text-transform: uppercase; }

        .date-selector { background: rgba(255, 183, 3, 0.1); padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 25px; border: 1px dashed var(--accent); display: flex; align-items: center; justify-content: center; gap: 20px; }
        .date-selector label { font-size: 20px; font-weight: bold; color: var(--accent); }
        .date-selector input { font-size: 28px; padding: 10px; width: 90px; border-radius: 8px; border: 2px solid var(--accent); background: var(--bg); text-align: center; font-weight: bold; color: #fff; }

        .file-upload-wrapper { margin-bottom: 25px; }
        input[type="file"] { display: block; width: 100%; padding: 20px; background: rgba(255,255,255,0.05); border: 2px dashed #555; border-radius: 8px; color: #fff; cursor: pointer; box-sizing: border-box; transition: 0.3s; text-align: center; font-size: 16px; }
        input[type="file"]:hover { border-color: var(--accent); background: rgba(255,255,255,0.1); }
        
        button.generate-btn { width: 100%; padding: 18px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3); }
        button.generate-btn:hover { background: #e0a000; transform: translateY(-2px); }
        button.generate-btn:active { transform: translateY(0); }
        
        #status { margin-top: 20px; text-align: center; font-weight: bold; min-height: 24px; padding: 15px; border-radius: 6px; font-size: 16px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: var(--accent); animation: spin 1s ease-in-out infinite; vertical-align: middle; margin-right: 10px;}
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-wrap">
            <h2>Генератор БР (Надійний Парсер)</h2>
            <p class="subtitle">Автоматична заміна дати у тексті (дд.мм.рррр) на вибрану.</p>
        </div>

        <div class="date-selector">
            <label for="targetDate">Оберіть число місяця:</label>
            <input type="number" id="targetDate" value="1" min="1" max="31">
        </div>

        <div class="panel">
            <h3>⚙️ Колонки таблиці Excel (Букви)</h3>
            <div class="grid-settings">
                <div class="input-group">
                    <label>Звання</label>
                    <input type="text" id="colRank" value="B" maxlength="2">
                </div>
                <div class="input-group">
                    <label>Посада / Текст БР</label>
                    <input type="text" id="colPos" value="A" maxlength="2">
                </div>
                <div class="input-group">
                    <label>ПІБ</label>
                    <input type="text" id="colName" value="C" maxlength="2">
                </div>
                <div class="input-group" style="border-left: 2px solid var(--accent); padding-left: 10px;">
                    <label>Колонка 1-го числа</label>
                    <input type="text" id="colDateStart" value="D" maxlength="2">
                </div>
                <div class="input-group">
                    <label>Початок даних (Рядок №)</label>
                    <input type="number" id="rowDataStart" value="2" min="1" max="20">
                </div>
                <div class="input-group" style="border-left: 2px solid var(--accent); padding-left: 10px;">
                    <label>Формат звіту</label>
                    <select id="outputFormat" style="padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-weight: bold; text-align: center; font-size: 14px; outline: none;">
                        <option value="table">Таблиця</option>
                        <option value="text">Простий текст</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="file-upload-wrapper">
            <input type="file" id="upload" accept=".xlsx, .xls, .csv, .ods" />
        </div>
        
        <button class="generate-btn" onclick="processData()">Згенерувати Word-документ</button>
        <div id="status"></div>
    </div>

    <script>
        function letterToIndex(letter) {
            let str = String(letter).toUpperCase().replace(/[^A-Z]/g, '');
            if (!str) return 0;
            let index = 0;
            for (let i = 0; i < str.length; i++) {
                index = index * 26 + (str.charCodeAt(i) - 64);
            }
            return index - 1; 
        }

        function createDocxCell(text, isHeader = false, widthPercent = null) {
            const safeText = (text !== undefined && text !== null) ? String(text) : "";
            const cellOpts = {
                children: [
                    new docx.Paragraph({
                        // Задаємо Times New Roman та 13-й розмір шрифту (size: 26 у half-points)
                        children: [new docx.TextRun({ text: safeText, bold: isHeader, size: 26, font: "Times New Roman" })],
                        alignment: isHeader ? docx.AlignmentType.CENTER : docx.AlignmentType.LEFT
                    })
                ],
                verticalAlign: docx.VerticalAlign.CENTER,
                margins: { top: 100, bottom: 100, left: 100, right: 100 }
            };
            if (widthPercent) cellOpts.width = { size: widthPercent, type: docx.WidthType.PERCENTAGE };
            return new docx.TableCell(cellOpts);
        }

        function readFileAsync(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(new Uint8Array(e.target.result));
                reader.onerror = e => reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        function setStatus(msg, type = "info") {
            const statusDiv = document.getElementById('status');
            if(type === "loading") statusDiv.innerHTML = `<span class="spinner"></span> <span style="color:#aaa;">${msg}</span>`;
            else if (type === "success") statusDiv.innerHTML = `<span style="color:#00e676; background: rgba(0, 230, 118, 0.1); padding: 15px; display:block; border-radius: 8px;">✅ ${msg}</span>`;
            else if (type === "error") statusDiv.innerHTML = `<span style="color:#ff5252; background: rgba(255, 82, 82, 0.1); padding: 15px; display:block; border-radius: 8px;">❌ ${msg}</span>`;
            else statusDiv.innerHTML = `<span style="color:#ffb703;">${msg}</span>`;
        }

        // Форматування дати за поточним місяцем та роком
        function getFormattedDate(targetDate) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const dayStr = String(targetDate).padStart(2, '0');
            return `${dayStr}.${month}.${year}`;
        }

        async function processData() {
            const fileInput = document.getElementById('upload');
            const targetDate = parseInt(document.getElementById('targetDate').value);

            if (isNaN(targetDate) || targetDate < 1 || targetDate > 31) {
                setStatus("Введіть коректне число від 1 до 31!", "error"); return;
            }
            if (!fileInput.files.length) {
                setStatus("Завантажте файл таблиці!", "error"); return;
            }

            const data = await readFileAsync(fileInput.files[0]);
            const workbook = XLSX.read(data, {type: 'array'});
            
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            // raw: false гарантує, що дати (навіть якщо вони записані як числа в Excel) будуть прочитані як текст
            const json = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: "", raw: false});
            const dateStr = getFormattedDate(targetDate);

            const rankIdx = letterToIndex(document.getElementById('colRank').value);
            const posIdx = letterToIndex(document.getElementById('colPos').value);
            const nameIdx = letterToIndex(document.getElementById('colName').value);
            const dateStartIdx = letterToIndex(document.getElementById('colDateStart').value);
            const targetColIdx = dateStartIdx + (targetDate - 1); 
            const dataStartIdx = parseInt(document.getElementById('rowDataStart').value) - 1;
            const outputFormat = document.getElementById('outputFormat').value;

            let groupedData = {};
            let currentTaskText = "Загальний список";
            let memRank = ""; memPos = ""; memName = "";

            for (let r = dataStartIdx; r < json.length; r++) {
                const row = json[r];
                if (!row || row.length === 0) continue;

                let rawPos  = String(row[posIdx] || "").trim();
                let rawRank = String(row[rankIdx] || "").trim();
                let rawName = String(row[nameIdx] || "").trim();

                let isBR = false;
                for(let c = dateStartIdx; c <= dateStartIdx + 35; c++) {
                    if (String(row[c] || "").trim().toLowerCase() === "br") { isBR = true; break; }
                }

                if (isBR) {
                    // Заміна ВИКЛЮЧНО шаблону дд.мм.рррр або дд.мм.202... на вибрану дату
                    // Ні в якому разі не чіпаємо існуючі дати типу 30.05.2026
                    let taskText = (rawPos || rawName);
                    
                    // Регулярний вираз шукає 'дд.мм.рррр', 'дд.мм.2026' або 'дд.мм.202X' у будь-якому регістрі
                    taskText = taskText.replace(/дд\.мм\.(рррр|202\d)/gi, dateStr);
                    
                    currentTaskText = taskText;
                    memRank = ""; memPos = ""; memName = "";
                    continue;
                }

                if (rawPos)  memPos  = rawPos;  else rawPos  = memPos;
                if (rawRank) memRank = rawRank; else rawRank = memRank;
                if (rawName) memName = rawName; else rawName = memName;

                if (!rawRank && !rawPos && !rawName) continue;

                const mark = String(row[targetColIdx] || "").trim().toLowerCase();
                if (mark && mark !== "0" && mark !== "-" && mark !== "br" && !mark.includes("202") && !mark.includes("/")) {
                    if (!groupedData[currentTaskText]) groupedData[currentTaskText] = [];
                    groupedData[currentTaskText].push({ rank: rawRank, pos: rawPos, name: rawName });
                }
            }

            const docChildren = [];
            for (const [taskName, people] of Object.entries(groupedData)) {
                docChildren.push(new docx.Paragraph({ 
                    children: [new docx.TextRun({ text: taskName, bold: true, size: 26, font: "Times New Roman" })], 
                    spacing: { before: 300, after: 150 } 
                }));
                
                if (outputFormat === 'table') {
                    // Табличний вивід (ЗВАННЯ / ПІБ / ПОСАДА)
                    const tableRows = [new docx.TableRow({ children: [
                        createDocxCell('№', true, 5), 
                        createDocxCell('Звання', true, 20), 
                        createDocxCell('ПІБ', true, 30), 
                        createDocxCell('Посада', true, 45)
                    ] })];
                    
                    people.forEach((p, i) => tableRows.push(new docx.TableRow({ children: [
                        createDocxCell(i + 1, false, 5), 
                        createDocxCell(p.rank, false, 20), 
                        createDocxCell(p.name, false, 30), 
                        createDocxCell(p.pos, false, 45)
                    ] })));
                    
                    docChildren.push(new docx.Table({ 
                        rows: tableRows, 
                        width: { size: 100, type: docx.WidthType.PERCENTAGE }, 
                        // Оновлені розміри: №(5%), Звання(20%), ПІБ(30%), Посада(45%)
                        columnWidths: [500, 2000, 3000, 4500] 
                    }));
                } else {
                    // Текстовий вивід без нумерації
                    people.forEach((p) => {
                        let textLine = "";
                        if (p.rank) textLine += p.rank;
                        if (p.name) textLine += (textLine ? " " : "") + p.name;
                        if (p.pos) textLine += (textLine ? ", " : "") + p.pos;
                        
                        docChildren.push(new docx.Paragraph({
                            children: [new docx.TextRun({ text: textLine, size: 26, font: "Times New Roman" })],
                            spacing: { after: 100 },
                            alignment: docx.AlignmentType.LEFT
                        }));
                    });
                }
            }
            
            const doc = new docx.Document({ sections: [{ children: docChildren }] });
            const blob = await docx.Packer.toBlob(doc);
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a"); a.href = url; a.download = `БР_Список_за_${targetDate}_число.docx`; document.body.appendChild(a); a.click();
            setStatus("✅ Готово!", "success");
        }
    </script>
</body>
</html>
