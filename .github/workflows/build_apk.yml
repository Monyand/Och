name: Збірка MilitaryCyberAudit APK

on:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Компіляція Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Прийняття ліцензій Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Надання прав на запуск Gradle Wrapper
        run: |
          cd android_app
          chmod +x gradlew || true

      - name: Збірка Release APK
        run: |
          cd android_app
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Перейменування готового APK
        run: |
          mkdir -p build_output
          find android_app/app/build/outputs/apk/ -name "*.apk" -exec cp {} build_output/MilitaryCyberAudit.apk \;

      - name: Вивантаження готового APK як артефакту
        uses: actions/upload-artifact@v4
        with:
          name: MilitaryCyberAudit-v1.0.0-APK
          path: build_output/MilitaryCyberAudit.apk
          if-no-files-found: error
          retention-days: 30
